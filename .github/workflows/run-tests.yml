name: Build and test

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Detect secrets
        uses: govuk-pay/pay-ci/actions/detect-secrets@8597f9957716cb928c22ed66ee0704a24798ce6e

  build-and-test:
    name: Container Build Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Docker build
        run: |
          docker build -t pay-adot:github-tests .
      - name: Run tests
        working-directory: tests/
        run: ./test.sh

  check-docker-base-images-are-manifests:
    uses: govuk-pay/pay-ci/.github/workflows/_validate_docker_image_is_manifest.yml@8597f9957716cb928c22ed66ee0704a24798ce6e
